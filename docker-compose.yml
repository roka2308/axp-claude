# Local development stack for the Analytics Experience Platform.
# Product store only - no Matomo analytics results are ever persisted here.
services:
  mysql:
    image: mysql:8.4
    container_name: axp-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-axp_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-axp}
      MYSQL_USER: ${MYSQL_USER:-axp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-axp_dev}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - axp-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-axp_root_dev}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: axp-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - '${ADMINER_PORT:-8081}:8080'

  mailpit:
    # Captures invite / recovery / report mails during development.
    image: axllent/mailpit:latest
    container_name: axp-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  axp-mysql-data:
    name: axp-mysql-data
